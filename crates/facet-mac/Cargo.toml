[package]
name = "facet-mac"
description = "Composition root and platform adapters for macOS."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
facet-core.workspace = true
slint.workspace = true
tray-icon.workspace = true

[build-dependencies]
slint-build.workspace = true

# Matching the versions tray-icon already pins, so no second copy of either is pulled in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3"
